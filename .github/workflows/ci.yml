name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpstan
          coverage: none

      - name: Core — install
        working-directory: packages/core
        run: composer install --no-interaction --prefer-dist

      - name: Core — tests
        working-directory: packages/core
        run: vendor/bin/phpunit

      - name: Core — PHPStan
        working-directory: packages/core
        run: phpstan analyse --no-progress

      - name: Laravel bridge — install
        working-directory: packages/laravel
        run: composer install --no-interaction --prefer-dist

      - name: Laravel bridge — tests
        working-directory: packages/laravel
        run: vendor/bin/phpunit

      - name: Sandbox — install
        working-directory: sandbox
        run: composer install --no-interaction --prefer-dist

      - name: Sandbox — tests
        working-directory: sandbox
        run: vendor/bin/phpunit
